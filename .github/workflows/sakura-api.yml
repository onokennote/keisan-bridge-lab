# server/api.php が変わったら、さくらのレンタルサーバー（~/www/kb/api.php）へ自動で送る
# 必要な Secrets（GitHub → Settings → Secrets and variables → Actions）：
#   SAKURA_HOST（例 onoken-web.sakura.ne.jp）・SAKURA_USER（例 onoken-web）・SAKURA_PASSWORD（サーバーパスワード）
# config.php とデータベースは送らない（サーバーにあるものをそのまま使う）
name: さくらにAPIを送る
on:
  push:
    branches: [claude/lucid-curie-k2el7s]
    paths: [server/api.php, .github/workflows/sakura-api.yml]
  workflow_dispatch:
concurrency: sakura-api
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 設定の確認
        id: cfg
        env:
          H: ${{ secrets.SAKURA_HOST }}
        run: |
          if [ -z "$H" ]; then echo "Secrets（SAKURA_HOST など）が未設定なので送りません"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: 文法チェック
        if: steps.cfg.outputs.skip != '1'
        run: php -l server/api.php
      - name: 送る（SFTP）
        if: steps.cfg.outputs.skip != '1'
        env:
          H: ${{ secrets.SAKURA_HOST }}
          U: ${{ secrets.SAKURA_USER }}
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          # パスワードは環境変数で渡す（記号が入っていても崩れない）。中身は出さず、長さと前後の空白だけ確かめる
          echo "ユーザー名の長さ: ${#U}  パスワードの長さ: ${#LFTP_PASSWORD}"
          case "$LFTP_PASSWORD" in " "*|*" ") echo "パスワードの前後に空白が入っています";; esac
          case "$U" in *@*|*" "*) echo "ユーザー名に @ や空白が入っています（アカウント名だけにしてください）";; esac
          # まず SFTP、だめなら FTPS（暗号化したFTP。証明書は確かめる）で送る
          if lftp -e "set sftp:auto-confirm yes; set net:max-retries 1; put server/api.php -o www/kb/api.php; bye" --env-password -u "$U" "sftp://$H"; then echo "SFTPで送りました"
          else
            echo "SFTPで入れませんでした。FTPSで試します"
            lftp -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 1; put server/api.php -o www/kb/api.php; bye" --env-password -u "$U" "ftp://$H" && echo "FTPSで送りました"
          fi
      - name: AI研究員の鍵を送る（KB_ADMIN_KEY があるときだけ。公開フォルダの外の kb_data に置く）
        if: steps.cfg.outputs.skip != '1'
        env:
          H: ${{ secrets.SAKURA_HOST }}
          U: ${{ secrets.SAKURA_USER }}
          LFTP_PASSWORD: ${{ secrets.SAKURA_PASSWORD }}
          K: ${{ secrets.KB_ADMIN_KEY }}
        run: |
          if [ -z "$K" ]; then echo "KB_ADMIN_KEY が未設定なので送りません"; exit 0; fi
          printf '%s' "$K" > admin_key.txt
          lftp -e "set sftp:auto-confirm yes; set net:max-retries 1; put admin_key.txt -o kb_data/admin_key.txt; chmod 600 kb_data/admin_key.txt; bye" --env-password -u "$U" "sftp://$H"
          rm -f admin_key.txt
      - name: 動いているか確かめる
        if: steps.cfg.outputs.skip != '1'
        env:
          H: ${{ secrets.SAKURA_HOST }}
        run: |
          want=$(grep -o "'api' => [0-9]*" server/api.php | grep -o '[0-9]*$')
          got=$(curl -fsS "https://$H/kb/api.php")
          echo "$got"
          echo "$got" | grep -q "\"api\":$want" || { echo "api のバージョンが $want になっていません"; exit 1; }
