.ach-big{position:fixed;inset:0;z-index:140;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);pointer-events:none;animation:whIn .2s ease both;overflow:hidden}
.ach-big.out{animation:whOut .4s ease both}
.ab-rays{position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(rgba(255,255,255,.1) 0 9deg,transparent 9deg 18deg);animation:hqSpin 10s linear infinite}
.ach-big.t2 .ab-rays,.ach-big.t3 .ab-rays{background:repeating-conic-gradient(rgba(255,224,102,.2) 0 9deg,transparent 9deg 18deg)}
.ab-in{position:relative;width:min(300px,86vw);padding:16px 14px 14px;border-radius:20px;text-align:center;background:linear-gradient(170deg,#1e3a2c,#0c1a13);border:3px solid #c98a4a;box-shadow:0 0 0 5px rgba(201,138,74,.2),0 18px 50px rgba(0,0,0,.6);animation:hqPop .55s cubic-bezier(.2,1.5,.4,1) both}
.ach-big.t1 .ab-in{border-color:#ced4da;box-shadow:0 0 0 5px rgba(206,212,218,.2),0 18px 50px rgba(0,0,0,.6)}
.ach-big.t2 .ab-in{border-color:#f2b632;box-shadow:0 0 0 5px rgba(242,182,50,.3),0 0 40px rgba(242,182,50,.5)}
.ach-big.t3 .ab-in{border-color:#d9a4ff;box-shadow:0 0 0 5px rgba(217,164,255,.3),0 0 40px rgba(217,164,255,.5)}
.ab-k{font-family:var(--f-display);font-size:24px;color:#ffe066;text-shadow:0 2px 0 #6b4500;animation:ciTxt .4s .15s both}
.ab-icon{margin:8px auto 4px;width:96px;height:96px;animation:abSpin .8s .2s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 0 14px rgba(255,224,102,.7))}
.ab-icon svg{width:96px;height:96px}
@keyframes abSpin{0%{transform:scale(.2) rotateY(540deg);opacity:0}100%{transform:none;opacity:1}}
.ab-n{font-size:22px;font-weight:900;color:#fff}
.ab-d{font-size:12px;color:var(--muted,#c9c2ad);margin-top:2px}
.ab-bp{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;color:#3a2600;background:#f2b632;border-radius:999px;padding:3px 12px}

.mode-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap}
.mode-hd h2{flex:0 1 auto;min-width:0}
.mode-bdg{display:flex;flex-wrap:wrap;justify-content:flex-end;align-content:center;gap:2px;flex:1 1 0;min-width:60px}
.mode-bdg.many .mb svg{width:21px;height:21px}
.mode-bdg .mb{padding:0;border:0;background:none;cursor:pointer;line-height:0;opacity:.85}
.mode-bdg .mb:not(.got) svg{filter:brightness(1.6) saturate(.3);opacity:.8}
.mode-bdg .mb.emb svg{width:30px;height:30px}
.mode-bdg.many .mb.emb svg{width:26px;height:26px}
.mode-bdg .mb.emb.got{filter:drop-shadow(0 0 5px rgba(217,164,255,.7))}
.mode-bdg .mb.got{opacity:1;filter:drop-shadow(0 0 4px rgba(242,182,50,.45))}
.mode-bdg .mb svg{width:26px;height:26px}

.mode-rows{display:flex;flex-direction:column;gap:3px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 8px}
.mode-rows .mr{display:flex;align-items:center;gap:6px}
.mode-rows .mr small{flex:0 0 5.2em;font-size:10px;color:var(--muted);white-space:nowrap}
.mode-rows .mode-bdg{justify-content:flex-start;flex:1 1 auto}
.mode-rows .mb.emb svg{width:26px;height:26px}
.mode-rows .mode-bdg .mb svg{width:24px;height:24px}
.mode-rows .mb{padding:0;border:0;background:none;cursor:pointer;line-height:0;opacity:.85;flex:0 0 auto}
.mode-rows .mb.emb:not(.got) svg{filter:brightness(1.6) saturate(.3);opacity:.8}
.mode-rows .mb.emb.got{filter:drop-shadow(0 0 5px rgba(217,164,255,.7))}
.mode-rows .mr small{flex:0 0 4.6em}
.mode-rows .mode-bdg{flex-wrap:nowrap;gap:1px}
.mode-rows .mode-bdg .mb svg{width:23px;height:23px}

.mode-rows .mode-bdg.wrap{flex-wrap:wrap;row-gap:3px;column-gap:6px}
.mode-rows .mb-ser{display:inline-flex;gap:1px}
.mode-rows .mode-bdg.wrap .mb svg{width:22px;height:22px}
.hq-zoro{display:block;width:fit-content;margin:2px auto 4px;padding:3px 12px;border-radius:999px;background:linear-gradient(90deg,#ff6b6b,#f2b632,#51cf66,#4dabf7,#b197fc);color:#1b1b1f;font-weight:900;font-size:13px;animation:ciTxt .5s .7s both}
.hq-zoro b{font-size:15px}

#toast-stack{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
#toast-stack .toast,#toast-stack .ach-toast{position:static;transform:none;left:auto;top:auto;bottom:auto;max-width:100%;text-align:center}
#toast-stack .toast{white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#toast-stack .ach-toast{animation:stIn .3s ease both}
#toast-stack .ach-toast.out{animation:stOut .35s ease-in both}
#toast-stack .toast{animation:stIn .25s ease both}
@keyframes stIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes stOut{to{opacity:0;transform:translateY(8px)}}

.unofficial{font-size:11px;color:var(--muted);margin:4px 0 0}
.unofficial a{color:var(--accent);text-decoration:underline;cursor:pointer}
.about-box{margin-top:14px}
.about-box h3{margin:0 0 8px;font-family:var(--f-display);font-weight:400;color:var(--accent)}
.about-box p{margin:0 0 8px;font-size:13px;line-height:1.7}
.about-links{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.about-links .btn{text-decoration:none}
.unofficial a{white-space:nowrap}
.about-links .btn,.about-links .btn:visited{color:var(--accent)}

.rv-duo-btn{display:flex;align-items:center;gap:4px}
.rv-duo-btn .rv-av+.rv-av{margin-left:-10px}
.rv-claude{align-items:center;gap:6px;flex-wrap:wrap}
.rv-claude .btn{padding:4px 10px;font-size:12px}
.rv-duo{display:flex;flex-direction:column;gap:8px}
.rv-line{display:flex;gap:8px;align-items:flex-start;animation:rvIn .35s calc(var(--i) * .12s) ease both}
.rv-line.masa{flex-direction:row-reverse}
.rv-line .cm-av{flex:0 0 36px;width:36px;height:36px}
.rv-line .cm-av svg{width:36px;height:36px}
.rv-line .cm-body{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:6px 10px;max-width:85%;display:flex;flex-direction:column;gap:2px}
.rv-line.root .cm-body{border-top-left-radius:4px}
.rv-line.masa .cm-body{border-top-right-radius:4px;background:rgba(242,182,50,.08);border-color:rgba(242,182,50,.3)}
.rv-line .cm-name{font-size:10px;color:var(--muted);font-weight:700}
.rv-line .cm-text{font-size:13px;line-height:1.65}
@keyframes rvIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 引っ越し（アーティファクト版 → 公開版）の案内 */
.mig-panel{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px auto 0;max-width:420px;text-align:center}

/* ★6カナタ：奥義「絶対透視」の演出 */
.toushi-fx{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box;pointer-events:none;background:radial-gradient(circle at 50% 38%,rgba(60,30,140,.92),rgba(5,4,18,.97) 70%);animation:txIn .35s ease both;text-align:center}
.toushi-fx .tx-eye{width:132px;height:132px;border-radius:24px;box-shadow:0 0 0 3px #f2b632,0 0 40px 10px rgba(242,182,50,.45);animation:txGlow 1.2s ease-in-out infinite alternate}
.toushi-fx .tx-eye svg{width:100%;height:100%}
.toushi-fx .tx-name{font-family:var(--f-display);font-size:clamp(30px,9vw,46px);color:#ffd43b;letter-spacing:.06em;text-shadow:0 0 18px rgba(255,212,59,.7),0 3px 0 #2b1d00;animation:txName .6s .15s cubic-bezier(.2,1.6,.4,1) both}
.toushi-fx .tx-sub{color:#e5dbff;font-size:14px;font-weight:700;max-width:420px}
.toushi-fx .tx-see{display:flex;flex-direction:column;gap:5px;max-width:440px;width:100%;transition:filter .5s,opacity .5s}
.toushi-fx .tx-row{display:flex;flex-wrap:wrap;align-items:center;gap:3px;justify-content:center;font-size:12px;color:#d0bfff}
.toushi-fx .tx-row b{min-width:4.5em;text-align:right;margin-right:4px;font-weight:700}
.toushi-fx .tx-c{display:inline-block;width:16px;height:22px;border-radius:3px;background:repeating-linear-gradient(45deg,#c92a2a 0 3px,#a61e1e 3px 6px);border:1px solid rgba(255,255,255,.6);animation:txCard 1.2s ease both}
.toushi-fx.hide-cards .tx-see{filter:blur(6px);opacity:.15}
.toushi-fx.out{animation:txOut .5s ease both}
@keyframes txIn{from{opacity:0}to{opacity:1}}
@keyframes txOut{to{opacity:0}}
@keyframes txGlow{from{box-shadow:0 0 0 3px #f2b632,0 0 24px 4px rgba(242,182,50,.35)}to{box-shadow:0 0 0 3px #ffd43b,0 0 56px 18px rgba(170,140,255,.55)}}
@keyframes txName{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes txCard{0%{opacity:0;transform:translateY(4px)}40%{opacity:1;transform:none}100%{opacity:.55;background:rgba(208,191,255,.35);border-color:#d0bfff;box-shadow:0 0 8px #b197fc}}
.kanata-ent{margin:10px auto 0;max-width:560px;text-align:left}
@media (prefers-reduced-motion:reduce){.toushi-fx,.toushi-fx *{animation:none!important}}

/* ご褒美アイテム「自動照準」 */
.aim-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid #f2b632;background:rgba(242,182,50,.12)}
.aim-btn small{font-size:11px;font-weight:400;color:var(--muted,#c9c2ad)}
.aim-bar{margin:0 0 8px;padding:6px 10px;border-radius:10px;background:rgba(242,182,50,.16);border:1px solid #f2b632;color:#ffe8a3;font-size:13px;text-align:center;animation:aimPulse 1s ease-in-out infinite alternate}
.aim-bar b{font-size:16px;color:#ffd43b}
.aim-fact{border-color:#f2b632!important;color:#ffd43b}
@keyframes aimPulse{from{box-shadow:0 0 0 rgba(242,182,50,0)}to{box-shadow:0 0 14px rgba(242,182,50,.45)}}
.aim-get{position:fixed;inset:0;z-index:115;display:flex;align-items:center;justify-content:center;background:rgba(5,10,8,.72);pointer-events:none;animation:txIn .3s ease both}
.aim-get .ag-in{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 22px;max-width:340px;text-align:center;border:2px solid #f2b632;border-radius:18px;background:#0e2a20;color:#fbf7ee}
.aim-get .ag-in svg{width:90px;height:90px}
.aim-get b{font-family:var(--f-display);font-size:26px;color:#ffd43b}
.aim-get small{color:#e9e3cf;line-height:1.5}
.aim-get.out{animation:txOut .4s ease both}

/* 早見表を作成 */
.chart-modal{display:flex;flex-direction:column;gap:8px}
.ch-rule{padding:6px 8px;border-radius:8px;background:rgba(242,182,50,.1);border:1px solid rgba(242,182,50,.4)}
.ch-wrap{max-height:34vh;overflow:auto;border:1px solid var(--line,#2a4a3c);border-radius:10px}
.ch-table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.ch-table th{position:sticky;top:0;background:#123326;color:#f2b632;padding:4px 0;font-weight:700;z-index:1}
.ch-table th:first-child{text-align:left;padding-left:6px}
.ch-table td{text-align:center;padding:3px 0;border-top:1px solid rgba(255,255,255,.06);min-width:18px}
.ch-table tr[data-crow]{cursor:pointer}
.ch-table tr.on{background:rgba(242,182,50,.16)}
.ch-table tr.full .ch-cards small{color:#ffd43b}
.ch-table td.ok{color:#ffd43b;font-weight:900;cursor:pointer}
.ch-table .ch-sec td{text-align:left;padding:5px 6px;color:#c9c2ad;font-weight:700;background:rgba(0,0,0,.25)}
.ch-cards{text-align:left!important;padding-left:6px!important;white-space:nowrap}
.ch-cards span,.ch-row-now span{display:inline-block;min-width:16px;margin-right:2px;padding:1px 2px;border-radius:3px;background:#fbf3dc;color:#1b1b1b;font-weight:900;text-align:center}
.ch-cards small{display:block;font-size:10px;line-height:1.1;color:#c9c2ad}
.ch-input{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:rgba(0,0,0,.25)}
.ch-row-now{display:flex;align-items:center;gap:4px}
.ch-row-now span{font-size:16px;padding:2px 6px}
.ch-row-now small{margin-left:auto;color:#c9c2ad}
.ch-expr{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px;padding:6px 10px;border-radius:8px;background:#0b1a14;font-size:18px}
.ch-expr b{font-size:15px;white-space:nowrap}
.ch-expr.good b{color:#69db7c}
.ch-expr.bad b{color:#ff8787}
.ch-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ch-k{min-height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#173d2f;color:#fbf7ee;font-size:18px;font-weight:900;cursor:pointer}
.ch-k.card-k{background:#fbf3dc;color:#1b1b1b}
.ch-k:disabled{opacity:.3;cursor:default}

/* 観戦：達人の1セット */
.watch-entry{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.w-table{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--felt,#0e3a2b);border:2px solid rgba(242,182,50,.35)}
.w-field{display:flex;align-items:center;justify-content:center;gap:10px}
.w-field .mc{min-width:44px;height:60px;font-size:26px;border-radius:7px}
.w-seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w-seat{padding:8px;border-radius:12px;background:rgba(0,0,0,.25);border:2px solid transparent;display:flex;flex-direction:column;gap:5px;min-width:0}
.w-seat.now{border-color:#f2b632}
.w-seat.win{border-color:#69db7c;background:rgba(105,219,124,.12)}
.w-head{display:flex;align-items:center;gap:6px}
.w-head svg{width:34px;height:34px;flex:none}
.w-head .av,.w-head > :first-child{flex:none}
.w-head b{display:block;font-size:13px}
.w-head small{display:block;font-size:10px;color:#c9c2ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-hand{display:flex;flex-wrap:wrap;gap:2px;min-height:20px}
.w-last{font-size:12px;min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-cm{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:12px;background:rgba(0,0,0,.28)}
.w-cm .cm-av{width:40px;height:40px;flex:none}
.w-cm .cm-av svg{width:100%;height:100%}
.w-cm .cm-name{display:block;font-size:11px;color:#f2b632;font-weight:700}
.w-sum{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.watch-invite{display:flex;flex-direction:column;gap:10px}
.watch-invite .wi-title{font-family:var(--f-display);font-size:24px;color:#ffd43b;text-align:center;animation:txName .6s cubic-bezier(.2,1.6,.4,1) both}
.watch-invite .wi-btns{justify-content:center;gap:10px;flex-wrap:wrap;opacity:0;animation:txIn .4s 2.4s ease both}
.w-hand .wc{font-style:normal;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:26px;height:36px;border-radius:5px;background:var(--card,#fbf3dc);color:var(--card-ink,#1b1b1b);font-weight:900;font-size:14px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.w-hand .wc small{font-size:10px;line-height:1}
.w-hand .wc.red{color:var(--card-red,#d6336c)}
.w-hand{gap:3px}
.w-head > div{min-width:0}

/* 観戦（本戦と同じ画面で） */
.watch-home{display:block;width:100%;margin:14px 0 4px;padding:14px;font-size:17px;font-weight:900;border:2px solid #f2b632;background:linear-gradient(180deg,rgba(242,182,50,.22),rgba(242,182,50,.08))}
body.spectate .me .controls,body.spectate .me .actions,body.spectate #hintpanel,body.spectate #prevpanel{display:none!important}
body.spectate .me .hand .card{cursor:default}
.open-hand{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 2px}
.open-hand .oh{font-style:normal;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:24px;height:32px;padding:0 1px;border-radius:5px;background:var(--card);color:var(--card-ink);font-weight:900;font-size:14px;line-height:1;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.open-hand .oh small{font-size:9px;line-height:1}
.open-hand .oh.red{color:var(--card-red)}
.watch-sum .ws-pps{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.watch-sum .ws-pp{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.25);text-align:left}
.watch-sum .ws-pp .av{width:36px;height:36px;flex:none}
.watch-sum .ws-pp .av svg{width:100%;height:100%}
.watch-sum .ws-pp > div{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.watch-sum .ws-pp small{color:#c9c2ad;font-size:10px}
.watch-sum .ws-pp.win{background:rgba(105,219,124,.16);outline:2px solid #69db7c}
.watch-sum .gs-head{display:flex;flex-direction:column;align-items:center}
.watch-sum .gs-head b{font-family:var(--f-display);font-size:24px;color:#ffd43b}
.watch-sum .ws-pps .ws-pp.win{flex-direction:row!important;justify-content:flex-start!important;text-align:left!important}
.seat .open-hand{grid-column:1/-1;display:flex!important;flex-direction:row!important;flex-wrap:wrap!important;align-items:center;gap:3px}
.seat .open-hand .oh{display:inline-flex!important;flex:none;width:auto}

/* チュートリアル */
.watch-sm{display:block;margin:2px 0 6px;font-size:13px}
.tut{display:flex;flex-direction:column;gap:10px}
.tut-top{display:flex;justify-content:space-between;align-items:center}
.tut-prog{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.tut-prog i{display:block;height:100%;background:#f2b632;transition:width .35s}
.tut-stage{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:60px}
.tut-hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tut-hand .card{animation:pop .3s ease-out backwards}
.tut.tut-static .tut-hand .card{animation:none}
.tut-hand.pick .card{cursor:pointer}
.tut-field{display:flex;justify-content:center}
.tut-field .fieldcard{position:relative;transform:none}
.tut-cap{margin:0;font-size:13px;color:#c9c2ad}
.tut-msg{min-height:22px;text-align:center;font-weight:700}
.tut-msg.good{color:#69db7c}
.tut-msg.bad{color:#ff8787}
.tut-opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tut-opts .btn{min-width:90px;font-size:17px}
.tut-exprs{display:grid;grid-template-columns:auto auto;gap:6px 12px;align-items:center}
.tut-exprs .mono{font-size:18px;font-weight:900;color:#ffd43b}
.tut-exprs small{color:#c9c2ad}
.tut-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.tut-flow span{padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.3);font-weight:700}
.tut-menu{margin:0;padding-left:1.1em;line-height:1.7;font-size:14px;text-align:left}
.tut-nav{justify-content:space-between;gap:8px}
.tut .op-lines{min-height:0!important;margin:0}
.tut.tut-static .op-line{animation:none!important;opacity:1!important;transform:none!important}
.about-tut{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}

/* このアプリができるまで */
.story{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.story-hero{text-align:center;padding:18px 12px;border-radius:18px;background:radial-gradient(ellipse at 50% 30%,#17533c,#0b1a14 80%);border:2px solid rgba(242,182,50,.45)}
.story-hero .sh-t{font-family:var(--f-display);font-size:clamp(24px,7vw,34px);line-height:1.3;color:#ffd43b}
.story-hero p{margin:6px 0 0;color:#c9c2ad}
.story-tl{list-style:none;margin:0;padding:0 0 0 6px;position:relative;display:flex;flex-direction:column;gap:12px}

/* アーティファクト版を閉じた画面（新しいサイトへの案内） */
.closed{max-width:640px;margin:0 auto;padding:24px 16px 40px;display:grid;gap:16px}

.pb-bio{flex-basis:100%;order:0;text-align:left;font:inherit;font-size:14px;line-height:1.65;color:var(--ink);background:rgba(0,0,0,.22);border:1px solid rgba(242,182,50,.35);border-radius:12px;padding:8px 12px;cursor:pointer;overflow-wrap:anywhere}

.cast-p:hover svg,.cast-p:focus-visible svg{transform:translateY(-2px)}
/* 絶対透視（2回目から）：軽い演出 */
.toushi-lite{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:120;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:rgba(40,20,100,.88);border:2px solid #b197fc;box-shadow:0 0 24px rgba(177,151,252,.6);pointer-events:none;animation:tlIn 1.3s ease both}

}

.ch-keys{grid-template-columns:repeat(5,1fr)}

/* モードのカード：自分の成績をまとめる */

.su{display:grid;gap:12px;padding-bottom:96px}

.su-poster{border:2px solid rgba(242,182,50,.6);background:linear-gradient(160deg,rgba(242,182,50,.14),rgba(0,0,0,.2))}

// ---------- 到達表（四則＋かっこ自由） ----------

  const ls = x.p < p ? '(' + x.s + ')' : x.s;
  const rs = (y.p < p || (y.p === p && (op === '-' || op === '/'))) ? '(' + y.s + ')' : y.s;
  const sym = { '+': '+', '-': '−', '*': '×', '/': '÷' }[op];

    if (i === j) continue;

    for (const op of ops) {

    const byT = []; for (let t = 0; t <= 13; t++) byT.push([]);
    const msets = [];
    for (let a = 1; a <= 13; a++) { msets.push([a]); for (let b = a; b <= 13; b++) { msets.push([a, b]); for (let c = b; c <= 13; c++) msets.push([a, b, c]); } }

        if (r.v < 1 || r.v > 13) continue;

      for (const t in best) byT[t].push({ vals: m, expr: best[t], n: m.length, sum, key: m.join(',') });

// counts: Int array[14]

  if (a === b && b === c) return counts[a] >= 3;
  if (a === b) return counts[a] >= 2 && counts[c] >= 1;

}

// ヒューリスティック評価（1手）
function heurScore(counts, m, st, unseen, flexScale) {
  const rest = sub(counts, m.vals);

  const left = nCounts(rest);

  const flex = flexScale ? nextPlayableProb(rest, unseen) * 10 : 0;

// AIの手選択（MC以外）。ctxはmc用

  if (lvCfg.mode === 'random') return ms[(r() * ms.length) | 0];

// ---------- 高速シミュレーション（値のみ） ----------

// ロールアウト用の相手モデル（性格・強さを反映した軽量版）

}
KB.makePolicy = makePolicy;
function polChoose(pol, h, t, r) {

  const rand = lv.mode === 'random';

function simRun(sim, maxRounds) {

// 相手の手札をサンプリング（推理つき）
// constraints:
//  {p, kind:'draw', t, add:[vals]}  … p は場 t のとき「引いた」。その後に出した札 add を手札に戻すと、
//                                     「引いた1枚」を除いた手札では t を作れなかったはず（見逃しの可能性は miss 率）
//  {p, kind:'play', t, key, add:[vals]} … p は場 t で key の組み合わせを出した。出す前の手札で、
//                                     その人の性格どおりの第一候補と一致していれば尤もらしい（不一致なら尤度を下げる）
function sampleHands(view, pool, r, pol) {
  const n = view.handSizes.length, me = view.me;
  const cons = view.constraints || [];
  for (let tries = 0; tries < 16; tries++) {
    shuffle(pool, r);
    const hands = []; let k = 0;
    for (let p = 0; p < n; p++) {
      if (p === me) { hands.push(view.hands[me]); continue; }
      const c = new Array(14).fill(0), fx = view.peek ? view.peek.hands[p] : [];
      for (const v of fx) c[v]++;
      for (let j = fx.length; j < view.handSizes[p]; j++) c[pool[k++]]++;
      hands.push(c);
    }
    let w = 1;
    for (const cs of cons) {
      const h0 = hands[cs.p]; if (!h0) continue;
      const pl = pol && pol[cs.p];
      const h = h0.slice(); if (cs.add) for (const v of cs.add) h[v]++;
      if (cs.kind === 'play') {
        if (!pl || pl.lv.mode === 'random') continue;
        for (const v of cs.vals) h[v]++; // 出す前の手札
        const b = polBest(pl, h, cs.t);
        if (b && b.key !== cs.key) w *= 0.45;
        continue;
      }
      const miss = pl ? (pl.lv.miss || 0) : 0;
      let consistent = false;
      for (let v = 1; v <= 13; v++) {
        if (!h[v]) continue;
        h[v]--; const mk = firstMoveOps(h, cs.t, pl ? pl.lv : null); h[v]++;
        if (!mk) { consistent = true; break; }
      }
      if (!consistent) {
        if (pl && pl.lv.see) { // 出せる組み合わせに一つも気づかなかった確率
          let pn = 1; for (const m of MOVES[pl.lv.ops][cs.t]) if (m.n <= pl.lv.maxCards && avail(h, m.vals)) pn *= 1 - pl.lv.see[m.cls];
          w *= miss + (1 - miss) * pn;

    }

    if (m.n === total) return m;

    const s = st.w.cards * m.n + st.w.value * m.sum + st.w.high * high;

// MC評価（共通乱数＋段階的絞り込み）
// view: {me, hands, handSizes, deckSize, discard, field, order, pos, constraints, models:[{level,style}]}
// ctx: {setPP, gamesLeftAfter, sd, mean, goalTable}
function evaluate(view, cands, rollouts, ctx, r) {
  r = r || rnd;
  const n = view.handSizes.length, me = view.me;
  const known = new Array(14).fill(0);
  for (let v = 1; v <= 13; v++) known[v] += view.hands[me][v];
  for (const v of view.discard) known[v]++;
  known[view.field]++;
  const pool = [];
  for (let v = 1; v <= 13; v++) for (let k = 0; k < 4 - known[v]; k++) pool.push(v);
  const pk = view.peek;
  if (pk) { const fixed = pk.hands.flat().concat(Object.values(pk.deck)); for (const v of fixed) { const i = pool.indexOf(v); if (i >= 0) pool.splice(i, 1); } }
  const pol = [];
  for (let p = 0; p < n; p++) {
    const md = view.models && view.models[p];
    pol.push(p === me ? makePolicy(4, 'keisan') : makePolicy(md ? md.level : 3, md ? md.style : 'keisan'));
  }
  const res = cands.map(c => ({ m: c, win: 0, pp: 0, goal: 0, n: 0, ppSq: 0, danger: 0, rank: 0, alive: true }));
  const goalMax = ctx && ctx.goalTable ? Math.max(...ctx.goalTable) || 1 : 1;
  const stages = cands.length > 3 ? 3 : 1;
  const totalIters = Math.max(12, Math.floor(rollouts / Math.max(1, cands.length)) * (stages > 1 ? 1.6 : 1));
  const perStage = Math.ceil(totalIters / stages);
  for (let s = 0; s < stages; s++) {
    for (let it = 0; it < perStage; it++) {
      const smp = sampleHands(view, pool, r, pol);
      let deck;
      if (pk) { deck = []; let q = 0; for (let k = 0; k < view.deckSize; k++) deck.push(pk.deck[k] != null ? pk.deck[k] : smp.rest[q++]); }
      else deck = smp.rest.slice(0, view.deckSize);
      const noise = []; for (let p = 0; p < n; p++) noise.push(ctx && ctx.gamesLeftAfter ? gauss(r) * (ctx.sd || 10) * Math.sqrt(ctx.gamesLeftAfter) : 0);
      const seed = (r() * 4294967296) >>> 0;
      for (const rr of res) {
        if (!rr.alive) continue;
        const sr = mulberry(seed); // 共通乱数
        const hands = smp.hands.map(h => h.slice());
        const sim = { hands, deck: deck.slice(), discard: view.discard.slice(), field: view.field, order: view.order, pos: view.pos + 1, r: sr, pol, me, meTurns: 0 };
        let w;
        const m = rr.m;
        if (m) { for (const v of m.vals) { hands[me][v]--; sim.discard.push(v); } }
        else { const v = simDraw(sim); if (v) hands[me][v]++; }
        if (m && nCounts(hands[me]) === 0) w = me; else w = simRun(sim);
        const pps = hands.map(h => sumCounts(h));
        if (w >= 0) pps[w] = 0;
        rr.n++; rr.pp += pps[me]; rr.ppSq += pps[me] * pps[me]; if (w === me) rr.win++;
        if (w >= 0 && w !== me && sim.meTurns === 0) rr.danger++;
        let better = 0; for (let p = 0; p < n; p++) if (p !== me && pps[p] < pps[me]) better++;
        rr.rank += better;
        if (ctx && ctx.goalTable) {
          const proj = pps.map((x, p) => (ctx.setPP ? ctx.setPP[p] : 0) + x + noise[p]);
          let b2 = 0; for (let p = 0; p < n; p++) if (p !== me && proj[p] < proj[me] - 1e-9) b2++;
          rr.goal += ctx.goalTable[Math.min(b2, ctx.goalTable.length - 1)];
        }

    }
    if (s < stages - 1) { // 下位を落とす
      const alive = res.filter(x => x.alive);
      const key = x => ctx && ctx.goalTable ? x.goal / x.n : -x.pp / x.n;
      alive.sort((a, b) => key(b) - key(a));

}

// 候補を絞る
KB.candidates = function (counts, t, limit) {
  const ms = findMoves(counts, t, 'all', 3);
  if (!ms.length) return [];
  // 同じ「残り手札」になる手は1つに
  const seen = new Set(), out = [];

// 予選：今のセット順位 r ごとの決勝進出確率（推定）
// 全卓AIで600大会を回して測った「強さ別の1ゲームPP（平均・ばらつき）」を使い、
// 今のセットの残りゲーム → 将来セット（毎回席替え）→ 総合順位（得点→累計PP）までをまとめてシミュレーションする。

  const F = T.cfg.finalists, pts = T.cfg.points, sets = T.cfg.sets, games = T.cfg.games;
  const myT = T.tables[T.myTable], sz = myT.length;

  const ids = T.players.map(p => p.id);
  const models = {}; T.players.forEach(p => { models[p.id] = ppModel(T, p); });
  const draw = (id, nGames) => { // nGames ゲーム分のPP合計
    if (nGames <= 0) return 0;

      T.tables.forEach((t, ti) => {

// 大会設定画面の目安：打ち方ごとの「1ゲーム平均PP」から決勝進出率をすばやく推定
// （AIの最善手を打ち続けた場合の平均PP 7.4 は、160大会のシミュレーションで測った値。実測の決勝進出率は80%）
const PLAY_STYLES = [
  { key: 'best', label: 'AIの最善手を打ち続けた場合', mu: 7.4 },
  { key: 'l4', label: '★4（上級AI）相当の打ち方', mu: 8.7 },
  { key: 'l3', label: '★3（中級AI）相当の打ち方', mu: 10.2 }

function estimateQualify(cfg, myMu) {
  const n = cfg.nPlayers, sizes = KB.splitTables(n, 5), N = 2500, W = MIX[cfg.mix].w;
  const tw = W.reduce((a, b) => a + b, 0);
  const pick = () => { let x = KB.rand() * tw; for (let i = 0; i < 5; i++) { x -= W[i]; if (x <= 0) return i + 1; } return 5; };
  let q = 0;
  for (let it = 0; it < N; it++) {
    const mus = [[myMu, 9.0]]; for (let i = 1; i < n; i++) mus.push(LV_PP[pick()]);
    const pts = new Array(n).fill(0), pp = new Array(n).fill(0);
    for (let s = 0; s < cfg.sets; s++) {
      const ids = KB.shuffle([...Array(n).keys()]); let k = 0;
      for (const z of sizes) {
        const tb = ids.slice(k, k + z); k += z;
        const v = tb.map(id => { const m = mus[id]; const x = Math.max(0, m[0] * cfg.games + KB.gauss() * m[1] * Math.sqrt(cfg.games)); pp[id] += x; return { id, x }; }).sort((a, b) => a.x - b.x);

    if (better < cfg.finalists) q++;

}

// 総合評価：目標（決勝進出率など）を主軸に、上がり率と期待PPも加味する。

// 大会のバッジが付かない理由（付かないときは黙らず、理由を知らせる）
function tourNoBadge(T) {
  if (T.tourHinted) return 'この大会でAIの読みを見たか、待ったを使ったため';
  const e = badgeElig(T); if (e.tour) return null;
  const r = [];
  if (T.cfg.nPlayers < ELIG.tourPlayers) r.push(`参加${ELIG.tourPlayers}人以上`);
  if (T.cfg.sets < ELIG.tourSets) r.push(`予選${ELIG.tourSets}セット以上`);
  if (T.cfg.games < ELIG.games) r.push(`1セット${ELIG.games}ゲーム以上`);
  if (e.aiAvg < ELIG.oppAvg) r.push(`参加AIの平均★${ELIG.oppAvg}以上（この大会は★${e.aiAvg.toFixed(1)}）`);
  return r.length ? '条件（' + r.join('・') + '）を満たしていないため' : '条件を満たしていないため';
}
function startFinal() {
  closeModal();
  const T = S.T; T.phase = 'final'; T.set = 1; T.game = 1; T.finalPP = {}; S.T.setLog = []; T.setT0 = Date.now(); T.pbSnap = rvSnap();
  T.finalists.forEach(id => T.finalPP[id] = 0);
  seatSet(T);
  if (T.finalists.includes(0)) { const why = tourNoBadge(T); if (!why) { bump('qualify'); T.aimNow = aimReward(T, 'final'); if (['strong', 'master'].includes(T.cfg.mix)) setMax('qualify_strong', T.cfg.mix === 'master' ? 2 : 1); } else setTimeout(() => toast(`決勝進出！ ただし${why}、大会のバッジは対象外です`), 1200); T.setFouls = 0; T.setHinted = false; if (T.aimNow) { const n = T.aimNow; T.aimNow = 0; aimHandover(n, 'final', startGame); } else startGame(); return; }
  // 観戦：全ゲーム自動
  const pls = T.tables[0].map(id => P(id));
  for (let gI = 0; gI < T.cfg.games; gI++) { const gm = KB.autoGame(pls, starterFor(T.tables[0], gI + 1)); pls.forEach((p, i) => { T.setPP[p.id].push(gm.pp[i]); T.finalPP[p.id] += gm.pp[i]; }); }

}
function finalResult() {
  const T = S.T;
  const ids = T.finalists.slice().sort((a, b) => T.finalPP[a] - T.finalPP[b]);
  // 同点グループごとに順位決定
  const groups = []; let i = 0;
  while (i < ids.length) { let j = i; while (j + 1 < ids.length && T.finalPP[ids[j + 1]] === T.finalPP[ids[i]]) j++; groups.push(ids.slice(i, j + 1)); i = j + 1; }
  const order = [];
  const nextGroup = k => {
    if (k >= groups.length) { T.finalOrder = order; T.done = true; store.del('session'); if (!T.statDone) { T.statDone = true; stat('tDone'); } if (badgeElig(T).tour) bump('tour_done'); if (order[0] === 0) { const why = tourNoBadge(T); if (!why) { bump('champion'); { const n = aimReward(T, 'champion'); if (n) setTimeout(() => aimHandover(n, 'champion'), 1800); } if (T.kanataClear) bump('toushi'); if (['strong', 'master'].includes(T.cfg.mix)) setMax('champion_strong', T.cfg.mix === 'master' ? 2 : 1); } else setTimeout(() => toast(`優勝！ ただし${why}、大会のバッジは対象外です`), 1500); } /* 参加15人以上の大会のみ */ go('result'); return; }
    const g = groups[k];
    if (g.length === 1) { order.push(g[0]); nextGroup(k + 1); return; }
    resolveTie(g, `決勝 ${order.length + 1}位決定戦`, 1, o => { order.push(...o); nextGroup(k + 1); });

}

function resolveTie(ids, label, slots, done) {

// 大会の決勝進出と優勝の確率（estimateQualify と同じ考え方で、決勝の1セットまで続ける）
function estimateTour(cfg, myMu, N) {
  const n = cfg.nPlayers, sizes = KB.splitTables(n, 5), W = MIX[cfg.mix].w, tw = W.reduce((a, b) => a + b, 0);
  const pick = () => { let x = KB.rand() * tw; for (let i = 0; i < 5; i++) { x -= W[i]; if (x <= 0) return i + 1; } return 5; };
  const draw = m => Math.max(0, m[0] * cfg.games + KB.gauss() * m[1] * Math.sqrt(cfg.games));
  let q = 0, w = 0;
  for (let it = 0; it < N; it++) {

  const draw = m => Math.max(0, m[0] * cfg.games + KB.gauss() * m[1] * Math.sqrt(cfg.games));
  let pts = 0, top = 0;
  for (let it = 0; it < N; it++) {

function deepHint() {
  const g = S.game; const me = g.current(); const H = S.hint; if (!H || !H.ev) return;

  setTimeout(() => {
    const cands = H.ev.slice(0, 5).map(e => e.m).filter(Boolean);
    const ev = KB.evaluate(H.view, cands.length ? cands : [null], 12000, H.ctx);
    rankEv(ev, H.ctx);
    const rest = H.ev.slice(5);
    H.ev = ev.concat(rest); H.busy = false; renderHint();
  }, 30);
}
function evalMine() {
  const g = S.game; const me = g.current(); const H = S.hint; if (!H || !H.ev) return;

  const m = KB.evalSelection(vals, H.t); if (!m) return;
  H.busy = true; renderHint();
  setTimeout(() => {

    H.ev.push(adj); rankEv(H.ev, H.ctx); H.busy = false; renderHint();
  }, 30);

  else if (myTurn) prev = !vals.length ? '<span class="muted" style="color:var(--felt-muted)">カードを1〜3枚選ぶと式を自動で探します</span>' : ok ? `<span class="ok">${esc(ok.expr)} = ${f.v}</span><span class="small" style="color:var(--felt-muted)">出せます</span>` : `<span class="ng">${vals.map(KB.vname).join('・')} では ${f.v} を作れません</span>`;
  const myPlayed = g.played[pov] || [];
  const handHTML = spec ? (g.over && g.hands ? onCards(g.hands[pov]).map(c => cardHTML(c, { extra: 'disabled' })).join('') : [...Array(g.handN[pov])].map(() => '<span class="card back"></span>').join(''))
    : hand.map(c => cardHTML(c, { cls: (ON.sel.includes(c.id) ? 'sel ' : '') + ((ON.newIds || []).includes(c.id) ? 'new' : ''), extra: `data-oncard="${c.id}" ${myTurn ? '' : 'disabled'} aria-pressed="${ON.sel.includes(c.id)}"` })).join('');
  const meBox = `<div data-pi="${pov}" class="me ${cur === pov && v.phase === 'play' ? 'turn' : ''} ${g.over && g.winner === pov ? 'winner' : ''}">
      ${pov === order[0] ? dealerChip('dbtn seat-chip') : ''}${g.over && g.winner === pov ? confettiHTML() : ''}
      <div class="head"><span class="me-id"><span class="av me-av">${onAv(ps, g.over ? (g.winner === pov ? 'happy' : 'normal') : (g.handN[pov] <= 2 ? 'smug' : 'normal'))}${(() => { const b = bub[pov]; return b && Date.now() - b.at < (b.dur || 2600) ? `<div class="bubble me-bub ${Date.now() - b.at < 400 ? 'fresh' : ''}">${esc(b.text)}</div>` : ''; })()}</span><b>${esc(spec ? onName(ps) : ps.name)}</b><span class="me-info">手札 <b class="tnum">${g.handN[pov]}</b>枚${spec ? '' : `・合計 <b class="tnum">${hand.reduce((a, c) => a + c.v, 0)}</b>`}</span></span><span class="me-pp">${spec ? '' : '<button class="btn sm felt-btn on-chat-btn" data-act="on-chat" aria-label="ひとことを送る">💬</button>'}セットPP <b class="tnum">${tot(pov)}</b></span></div>
      ${spec ? '<div class="on-watch">👀 観戦中（手札は見えません）・ほかの席を押すと、その人の席から見られます</div>' : ''}
      ${mySub ? `<div class="on-sub">🤖 ${ps.auto ? `AI★${ps.subLv}に任せています（推定実力−1）` : '時間切れが3回続いたので、AI★2が代わりに打っています'} <button class="btn sm primary" data-act="on-back">自分で打つ</button></div>` : ''}
      ${myPlayed.length ? `<div class="mine-played"><span>出した札</span>${onPlayedHTML(g, pov, true)}</div>` : ''}
      <div class="hand ${spec ? 'on-backs' : ''}">${handHTML}</div>
      ${prev ? `<div class="preview">${prev}</div>` : ''}
      ${!spec && v.phase === 'play' ? `<div class="actions"><button class="btn primary" data-act="on-play" ${ok ? '' : 'disabled'}>出す</button><button class="btn felt-btn" data-act="on-draw" ${myTurn ? '' : 'disabled'}>引く</button>${mySub ? '' : `<button class="btn felt-btn sm" data-act="on-auto" title="いまの推定実力−1の強さ（最低★2）のAIが代わりに打ちます">🤖 AIに任せる</button>`}</div>` : ''}
    </div>`;
  const res = v.phase === 'done' ? (() => { const rows = [...Array(n).keys()].map(i => ({ i, t: tot(i) })).sort((a, b) => a.t - b.t); return `<div class="panel on-res"><h3 style="margin:0">🏁 セット終了</h3>${rows.map((r, k) => `<div class="on-rrow ${r.i === me ? 'me' : ''}"><b>${['🥇', '🥈', '🥉'][k] || k + 1}</b><span>${esc(onName(v.seats[r.i]))}</span><span>合計 ${r.t}PP</span></div>`).join('')}</div>`; })() : '';
  return top + `<div class="on-clock" id="on-clock"></div><div id="tablewrap"><div class="table ${cmHTML() ? 'has-cm' : ''} on-tbl">
    <div class="opps ring${n - 1}" style="--n:${n - 1}">${opp.join('')}</div>
    <div class="center">
      <div class="side deckside"><div class="deck" aria-label="山札 ${g.deckN}枚">${'<i></i>'.repeat(Math.min(5, Math.ceil(g.deckN / 6)))}<b class="tnum">${g.deckN}</b></div><span>山札</span><span>捨て札 ${g.discardN}</span></div>
      <div class="pilecol"><div class="pile">${f ? `<div class="fieldcard top ${f.s === 1 || f.s === 2 ? 'red' : ''} ${flipped ? 'deal' : ''}"><span class="tag">場 ・ 第${g.round}巡</span><span class="big">${KB.vname(f.v)}</span><span class="val">${KB.SUITS[f.s]} ${f.v}</span></div>` : ''}</div>${onFieldsHTML(g, flipped)}</div>
      ${cmHTML() || `<div class="side r"><span>手番</span><b>${g.over ? '終了' : esc(onName(v.seats[cur]))}</b></div>`}
    </div>
    ${strip}${win}${meBox}</div></div>${res}
    <p class="small muted" id="on-err" style="margin:0">${ON.err ? '⚠ ' + esc(ON.err) : ''}</p>`;
}

function onBind() {
  document.querySelectorAll('[data-onpov]').forEach(b => b.onclick = () => { ON.pov = +b.dataset.onpov; KB.sfx('select'); render(); });
  document.querySelectorAll('[data-oncard]').forEach(b => b.onclick = () => { const id = +b.dataset.oncard; ON.sel = ON.sel.includes(id) ? ON.sel.filter(x => x !== id) : ON.sel.length < 3 ? [...ON.sel, id] : ON.sel; KB.sfx('select'); render(); });
  onClock();
}
async function onAct(act, extra) {
  if (!ON.v) return;
  try { const v = await onReq('on_act', Object.assign({ id: ON.v.id, act }, extra || {})); const lg = v.game && v.game.log || [], lastMine = [...lg].reverse().find(e => e.p === v.me && (e.type === 'play' || e.type === 'draw')); if (act === 'play' && lastMine && lastMine.foul) { KB.sfx('foul'); toast(`お手つき！ ${lastMine.n}枚引きました`); } else if (act === 'play') KB.sfx(extra.vals.length === 3 ? 'play3' : 'play', extra.vals.length); else if (act === 'draw') KB.sfx('draw'); ON.sel = []; onApply(v); }
  catch (e) { toast(e.message || 'できませんでした'); }
}
